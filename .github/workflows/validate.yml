name: Thesis verification
on:
  push:
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install XeLaTeX and required fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science \
            fonts-texgyre \
            fonts-dejavu-core \
            lmodern

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Regenerate experiment results, tables, and audits
        run: |
          python3 src/experiment.py
          python3 src/make_tables.py
          python3 src/paired_analysis.py
          python3 src/gradient_audit.py
          python3 src/landscape_audit.py

      - name: Verify generated evidence is committed
        run: |
          git diff --exit-code -- \
            results/ \
            tex/generated_results.tex \
            tex/plot_data.tsv \
            tex/paired_results.tex \
            tex/gradient_moves.tex \
            tex/coordinate_landscape.tex

      - name: Build dissertation with XeLaTeX
        working-directory: tex
        run: |
          set -o pipefail
          xelatex -file-line-error -halt-on-error -interaction=nonstopmode thesis.tex 2>&1 | tee latex_ci.log
          xelatex -file-line-error -halt-on-error -interaction=nonstopmode thesis.tex 2>&1 | tee -a latex_ci.log

      - name: Upload XeLaTeX diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xelatex-build-log
          path: tex/latex_ci.log
          if-no-files-found: ignore

      - name: Upload compiled thesis PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsc-thesis-draft-pdf
          path: tex/thesis.pdf
